services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: apex
      POSTGRES_DB: apex
    ports:
      - '5433:5432'
    volumes:
      - apex-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U apex']
      interval: 5s
      retries: 10

volumes:
  apex-db:
